<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traçabilité des fraises — Sepolia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:20px;background:#fff8fa;color:#222}.card{background:#f9f9f9;padding:16px;margin:18px 0;border-radius:8px;border:1px solid #ead1d8}input,select{width:95%;padding:9px;margin:5px 0 10px}button{padding:10px 15px;background:#be123c;color:white;border:0;border-radius:4px;cursor:pointer}button:disabled{opacity:.5}.result{font-weight:bold;margin-top:10px;line-height:1.6}.muted{color:#667085}.row{border-top:1px solid #ddd;padding:10px 0}.hash{font-family:monospace;word-break:break-all;font-size:12px}@media(max-width:600px){body{margin:10px;padding:10px}}</style></head>
<body>
<h1>🍓 Traçabilité des fraises</h1><p class="muted">DApp directe MetaMask + Sepolia. Aucune iframe, aucun Streamlit.</p>
<button id="connectBtn">🦊 Connecter MetaMask</button><p id="walletAddress" class="muted">Portefeuille non connecté</p><p id="network" class="muted">Réseau non vérifié</p>
<div class="card"><h2>1. Vérifier un lot — lecture gratuite</h2><input id="searchId" value="LOUKKOS-2026-0001" placeholder="Texte du lot ou lotId 0x..."><p id="hashInfo" class="muted"></p><button id="verifyBtn">Vérifier l’historique</button><div id="verifyResult" class="result"></div><canvas id="qr"></canvas></div>
<div class="card"><h2>2. Créer un lot</h2><input id="lotId" value="LOUKKOS-2026-0001" placeholder="Identifiant"><input id="product" value="Fraises Gariguette" placeholder="Produit"><input id="origin" value="Coopérative Loukkos, Larache" placeholder="Origine"><input id="lotMetadata" placeholder="URI métadonnées facultative"><button id="createBtn" disabled>Enregistrer le lot</button><div id="createStatus" class="result"></div></div>
<div class="card"><h2>3. Ajouter une étape</h2><input id="stageLotId" value="LOUKKOS-2026-0001" placeholder="Identifiant du lot"><select id="stageType"><option>Production</option><option>Récolte</option><option>Conditionnement</option><option>Transport</option><option>Vente</option></select><input id="location" value="Loukkos / Larache" placeholder="Lieu"><input id="stageMetadata" placeholder="URI preuve facultative"><button id="stageBtn" disabled>Enregistrer l’étape</button><div id="stageStatus" class="result"></div></div>
<script>
// Remplacer par l’adresse du contrat TraceabilityRegistry déployé sur Sepolia.
const contractAddress = "0x121819EdD143c80C042A20F7dDa8b948ce43ed87";
const contractABI=["function createLot(bytes32 lotId,string product,string origin,string metadataURI)","function addStage(bytes32 lotId,string stageType,string location,string metadataURI)","function getLot(bytes32 lotId) view returns (tuple(string product,string origin,string metadataURI,address creator,uint64 createdAt,bool exists))","function getStageCount(bytes32 lotId) view returns (uint256)","function getStage(bytes32 lotId,uint256 index) view returns (tuple(string stageType,string location,string metadataURI,address actor,uint64 timestamp))"];
const SEPOLIA=11155111;const RPC_URL='https://ethereum-sepolia-rpc.publicnode.com';let provider,signer,contract;const $=id=>document.getElementById(id);
function lotHash(value){const x=value.trim();if(/^0x[0-9a-fA-F]{64}$/.test(x))return x;return ethers.id(x)}
function showHash(){const x=$('searchId').value.trim();$('hashInfo').textContent=x?'lotId utilisé : '+lotHash(x):''}
function setStatus(id,text,bad=false){$(id).textContent=text;$(id).style.color=bad?'#b42318':'#166534'}function enable(v){$('createBtn').disabled=!v;$('stageBtn').disabled=!v}
async function connect(){try{if(!window.ethereum)throw Error('MetaMask n’est pas installé dans ce navigateur.');if(!ethers.isAddress(contractAddress))throw Error('Configurez contractAddress dans index.html.');provider=new ethers.BrowserProvider(window.ethereum);await provider.send('eth_requestAccounts',[]);let net=await provider.getNetwork();if(Number(net.chainId)!==SEPOLIA){await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0xaa36a7'}]});net=await provider.getNetwork()}if(Number(net.chainId)!==SEPOLIA)throw Error('Sélectionnez le réseau Sepolia.');signer=await provider.getSigner();contract=new ethers.Contract(contractAddress,contractABI,signer);$('walletAddress').textContent='Connecté : '+await signer.getAddress();$('network').textContent='Réseau : Sepolia (11155111)';enable(true)}catch(e){enable(false);setStatus('verifyResult',e.shortMessage||e.message||String(e),true)}}
async function readContract(){if(!ethers.isAddress(contractAddress))throw Error('Adresse du contrat absente dans index.html.');return new ethers.Contract(contractAddress,contractABI,new ethers.JsonRpcProvider(RPC_URL))}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function verify(){try{const text=$('searchId').value.trim();if(!text)throw Error('Saisissez l’identifiant texte ou le lotId hexadécimal.');setStatus('verifyResult','Lecture de Sepolia…');showHash();const c=await readContract(),key=lotHash(text),lot=await c.getLot(key),n=Number(await c.getStageCount(key));let h='<b>✅ Lot trouvé</b><br>Produit : '+esc(lot.product)+'<br>Origine : '+esc(lot.origin)+'<br>Créateur : <span class="hash">'+lot.creator+'</span><br>Créé le : '+new Date(Number(lot.createdAt)*1000).toLocaleString()+'<br><b>Nombre d’étapes : '+n+'</b>';for(let i=0;i<n;i++){const s=await c.getStage(key,i);h+='<div class="row"><b>'+esc(s.stageType)+'</b> — '+esc(s.location)+'<br><small>'+new Date(Number(s.timestamp)*1000).toLocaleString()+' — '+s.actor+'</small>'+(s.metadataURI?'<br>'+esc(s.metadataURI):'')+'</div>'}$('verifyResult').innerHTML=h;try{if(window.QRCode&&typeof window.QRCode.toCanvas==='function'){await window.QRCode.toCanvas($('qr'),location.href.split('?')[0]+'?lot='+encodeURIComponent(text))}else{$('qr').style.display='none';$('verifyResult').innerHTML+='<br><small>Historique lu. QR indisponible : rechargez la page avec Internet activé.</small>'}}catch(qrError){$('qr').style.display='none';$('verifyResult').innerHTML+='<br><small>Historique lu. QR non généré.</small>'}}catch(e){setStatus('verifyResult','❌ Lecture impossible : '+(e.shortMessage||e.reason||e.message||e)+'. Vérifiez le texte exact ou collez le lotId 0x... copié dans l’événement LotCreated.',true)}}
async function createLot(){try{if(!contract)await connect();if(!contract)return;const x=$('lotId').value.trim();if(!x||!$('product').value||!$('origin').value)throw Error('Remplissez tous les champs.');setStatus('createStatus','Confirmez dans MetaMask…');const tx=await contract.createLot(lotHash(x),$('product').value,$('origin').value,$('lotMetadata').value);setStatus('createStatus','Transaction en attente : '+tx.hash);await tx.wait();setStatus('createStatus','✅ Lot enregistré.');$('searchId').value=x;verify()}catch(e){setStatus('createStatus',e.shortMessage||e.message||String(e),true)}}
async function addStage(){try{if(!contract)await connect();if(!contract)return;setStatus('stageStatus','Confirmez dans MetaMask…');const tx=await contract.addStage(lotHash($('stageLotId').value),$('stageType').value,$('location').value,$('stageMetadata').value);setStatus('stageStatus','Transaction en attente : '+tx.hash);await tx.wait();setStatus('stageStatus','✅ Étape enregistrée.');$('searchId').value=$('stageLotId').value;verify()}catch(e){setStatus('stageStatus',e.shortMessage||e.message||String(e),true)}}
document.getElementById('connectBtn').onclick=connect;document.getElementById('verifyBtn').onclick=verify;document.getElementById('createBtn').onclick=createLot;document.getElementById('stageBtn').onclick=addStage;$('searchId').addEventListener('input',showHash);if(window.ethereum){window.ethereum.on('accountsChanged',()=>location.reload());window.ethereum.on('chainChanged',()=>location.reload())}const q=new URLSearchParams(location.search).get('lot');if(q){$('searchId').value=q;showHash();verify()}else{showHash()}
</script></body></html>
